<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Worlds</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Inter', system-ui, sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        #hud { position: absolute; top: 0; left: 0; pointer-events: none; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
        #progress-container { width: 100%; height: 3px; background-color: rgba(255,255,255,0.08); }
        #progress-bar { height: 100%; background-color: rgba(255,255,255,0.3); width: 0%; transition: width 0.5s ease; }
    </style>
</head>
<body>
    <div id="hud">
        <div id="progress-container"><div id="progress-bar"></div></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
